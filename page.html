<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Yourself Good - Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Page Links -->
    <nav class="page-nav">
        <a href="page.html" class="active">📝 TASKS</a>
        <a href="result.html">📊 RESULT</a>
    </nav>
    <!-- Date and Time -->
    <div class="datetime">
        <div id="date"></div>
        <div id="time"></div>
    </div>
    <div class="tasks-page">
        <h1 class="website-title">
            MAKE YOURSELF GOOD
        </h1>
        <p class="welcome-text">
            Hello Everyone 👋, welcome to Make Yourself Good 😊.
            This page is useful for your personal growth, habits, and time management.
        </p>
        <div class="quote-card" id="dailyQuote"></div>
        <h2>TODAY TASKS</h2>
        <!-- Add New Task Button -->
        <button class="add-button" onclick="showTaskForm()">
            + ADD NEW TASKS
        </button>
        <!-- Add Task Form -->
        <div id="taskForm" class="task-form">
            <input
                type="text"
                id="taskName"
                placeholder="Enter task name"
            >
            <input
                type="text"
                id="taskTime"
                placeholder="Example: 6:00 AM - 7:00 AM"
            >
            <button class="save-button" onclick="addTask()">
                ADD TASK
            </button>
            <button class="cancel-button" onclick="hideTaskForm()">
                CANCEL
            </button>
        </div>
        <!-- Tasks Table -->
        <div id="taskContainer" class="task-container">
            <table>
                <thead>
                    <tr>
                        <th>TASK NO</th>
                        <th>SET TIME</th>
                        <th>TASK NAME</th>
                        <th>DONE ✓</th>
                        <th>HALF DONE −</th>
                        <th>NO DONE ×</th>
                    </tr>
                </thead>
                <tbody id="taskList">
                </tbody>
            </table>
        </div>
        <!-- Progress -->
        <div id="progressPanel" class="progress-panel">
            <div class="progress-info">
                <span id="progressText"></span>
                <span id="progressPoints"></span>
                <span id="progressPercent"></span>
            </div>
            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>
        </div>
        <!-- Bottom Buttons -->
        <div class="bottom-buttons">
            <button class="refresh-button" onclick="refreshDay()">
                REFRESH
            </button>
            <button class="submit-button" onclick="submitTasks()">
                SUBMIT
            </button>
        </div>
        <p id="taskMessage" class="error"></p>
</div>
    <script src="script.js"></script>
</body>
</html>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}
body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, rgba(124,58,237,0.65), transparent 38%),
        radial-gradient(circle at 80% 30%, rgba(184,129,43,0.45), transparent 35%),
        radial-gradient(circle at 50% 95%, rgba(124,58,237,0.45), transparent 40%),
        linear-gradient(135deg, #050008, #2a0a4d, #0a0010 60%, #3a2508);
    background-attachment: fixed;
    color: #fff4dc;
}
/* DATE + TIME */

}
.welcome-box {

    font-weight: bold;
    color: #1a0a2e;
    background: rgba(212,160,60,0.9);
    border-radius: 5px;
    transform: skew(-8deg);
    box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
}
.login-title {
    margin-top: 45px;
    font-size: 70px;
    font-weight: bold;
    text-shadow:
        0 5px 15px rgba(0,0,0,0.4);
}
.login-box {
   width: 610px;
    max-width: 90%;
    margin-top: 35px;
}
.login-box label {
    display: block;

.login-box input {

/* MAIN BUTTON */
.main-button {

box-shadow:

<script>
    /* =====================================
   DATE AND TIME
===================================== */
function updateDateTime() {
    const now = new Date();
    const dateElement = document.getElementById("date");
    const timeElement = document.getElementById("time");
    if (dateElement) {
        dateElement.innerText =
            now.toLocaleDateString("en-IN",
        {
          weekday: "short",
                day: "2-digit",
                month: "short",
                year: "numeric"
            });
    }
    if (timeElement) {
        timeElement.innerText =
            now.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
    }
}
updateDateTime();
setInterval(updateDateTime, 1000);
/* =====================================
   DATA STORAGE
===================================== */
const today = new Date().toISOString().split("T")[0];
let data = JSON.parse(
    localStorage.getItem("makeYourselfGood")
);
/* =====================================
   NEW DAY CHECK
===================================== */
if (!data || data.date !== today) {
    data = {
        date: today,
        username: data ? data.username : "",
        tasks: []
    };
    localStorage.setItem(
        "makeYourselfGood",
        JSON.stringify(data)
    );
}
/* =====================================
   SAVE DATA
===================================== */
function saveData() {
    localStorage.setItem(
        "makeYourselfGood",
        JSON.stringify(data)
    );
}
/* =====================================
   LOGIN
===================================== */
function loginUser() {
    const username =
        document.getElementById("username").value.trim();
    const password =
        document.getElementById("password").value.trim();
    const error =
        document.getElementById("loginError");
    /*
       Fixed username and password
    */
    if (
        username !== "LEELADHARAN" ||
        password !== "462700"
    ) {
        error.innerText =
            "Invalid password.";
        return;
    }
    data.username = username;
    saveData();
    window.location.href = "page.html";
}
/* =====================================
   SHOW USERNAME
===================================== */
function displayUserName() {
    const userName =
        document.getElementById("userName");
    if (userName) {
        userName.innerText =
            data.username;
    }
}
displayUserName();
/* =====================================
   SHOW ADD TASK FORM
===================================== */
function showTaskForm() {
    const form =
        document.getElementById("taskForm");
    if (form) {
        form.style.display = "block";
    }
}
/* =====================================
   HIDE ADD TASK FORM
===================================== */
function hideTaskForm() {
    const form =
        document.getElementById("taskForm");
    if (form) {
        form.style.display = "none";
    }
}
/* =====================================
   ADD TASK
===================================== */
function addTask() {
    const name =
        document.getElementById("taskName")
        .value.trim();
    const time =
        document.getElementById("taskTime")
        .value.trim();
    const message =
        document.getElementById("taskMessage");
    if (name === "") {
        message.innerText =
          "Please enter the task name.";
        return;
    }
    if (time === "") {
        message.innerText =
            "Please enter the task time.";
        return;
    }
    const newTask = {
        id: Date.now(),
        name: name,
        time: time,
        status: null,
        points: 0
    };
    data.tasks.push(newTask);
    saveData();
    document.getElementById("taskName").value = "";
    document.getElementById("taskTime").value = "";
    message.innerText = "";
    hideTaskForm();
    displayTasks();
}
/* =====================================
   DISPLAY TASKS
===================================== */
function displayTasks() {
    const taskList =
        document.getElementById("taskList");
    const taskContainer =
        document.getElementById("taskContainer");
    if (!taskList) {
        return;
    }
    updateProgress();
    taskList.innerHTML = "";
    if (data.tasks.length === 0) {
        taskContainer.style.display = "none";
        return;
    }
    taskContainer.style.display = "block";
    data.tasks.forEach(function(task, index) {
        const row =
            document.createElement("tr");
        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${task.time}</td>
            <td>${task.name}
                <button class="delete-task" title="Delete task"
                    onclick="deleteTask(${task.id})">🗑</button>
            </td>
            <td>
                <button
                    class="status-button done
                    ${task.status === "done" ? "selected" : ""}"
                    onclick="setStatus(${task.id}, 'done')">
                    ✓
                </button>
            </td>
            <td>
                <button
                    class="status-button half
                    ${task.status === "half" ? "selected" : ""}"
                    onclick="setStatus(${task.id}, 'half')">
                    −
                </button>
            </td>
            <td>
                <button
                    class="status-button notdone
                    ${task.status === "notdone" ? "selected" : ""}"
                    onclick="setStatus(${task.id}, 'notdone')">
                    ×
                </button>
            </td>
        `;
        taskList.appendChild(row);
    });
}
displayTasks();
/* =====================================
   SET TASK STATUS
===================================== */
function setStatus(taskId, status) {
    const task =
        data.tasks.find(
            function(item) {
                return item.id === taskId;
            }
        );
    if (!task) {
        return;
    }
    task.status = status;
    if (status === "done") {
        task.points = 2;
    }
    else if (status === "half") {
        task.points = 1;
    }
    else if (status === "notdone") {
        task.points = 0;
    }
    saveData();
    displayTasks();
}
/* =====================================
   SUBMIT TASKS
===================================== */
function submitTasks() {
    const message =
document.getElementById("taskMessage");
    if (data.tasks.length === 0) {
        message.innerText =
            "Please add at least one task.";
        return;
    }
    let incomplete = data.tasks.some(
        function(task) {
            return task.status === null;
        }
    );
    if (incomplete) {
        message.innerText =
            "Please select a status for every task.";
        return;
    }
    saveData();
    window.location.href = "result.html";
}
/* =====================================
   GET PERFORMANCE
===================================== */
function getPerformance(points) {
    if (points === 2) {
        return {
            text: "Excellent",
            className: "excellent"
        };
    }
    if (points === 1) {
        return {
            text: "Good",
            className: "good"
        };
    }
    return {
        text: "Poor",
        className: "poor"
    };
}
/* =====================================
   DISPLAY RESULT
===================================== */
function displayResult() {
    const resultList =
        document.getElementById("resultList");
    if (!resultList) {
        return;
    }
    resultList.innerHTML = "";
    let totalPoints = 0;
    data.tasks.forEach(function(task, index) {
        totalPoints += task.points;
        const performance =
            getPerformance(task.points);
        const row =
            document.createElement("div");
        row.className = "result-row";
        row.innerHTML = `
            <span>${index + 1}</span>
            <span>${task.time}</span>
            <span>${task.name}</span>
            <span class="points">
                ${task.points}
            </span>
            <span class="${performance.className}">
                ${performance.text}
            </span>
        `;
        resultList.appendChild(row);
    });
    const maximumPoints =
        data.tasks.length * 2;
    const totalElement =
        document.getElementById("totalPoints");
    const maxElement =
        document.getElementById("maxPoints");
    totalElement.innerText =
        totalPoints;
    maxElement.innerText =
        maximumPoints;
    /* Overall performance */
    let overall = "Poor";
    if (data.tasks.length > 0) {
        const average =
            totalPoints / data.tasks.length;
        if (average >= 1.5) {
            overall = "Excellent";
        }
        else if (average >= 0.5) {
            overall = "Good";
        }
        else {
            overall = "Poor";
        }
    }
    const overallElement =
        document.getElementById("overallResult");
    overallElement.innerText =
        overall;
    overallElement.className =
        overall.toLowerCase();
}
displayResult();
/* =====================================
   REFRESH / CLEAR ALL TASKS
===================================== */
function refreshDay() {
    /*
       CLEAR ALL TASKS
    */
    data.tasks = [];
    /*
       Keep the username
    */
    data.date =
        new Date().toISOString().split("T")[0];
    saveData();
    /*
       Go to the new empty task page
    */
    window.location.href =
        "result.html";
}
/* =====================================
   NEW FEATURES
===================================== */
function getQuote(level) {
    const quotes = {
        general: [
            "Small steps every day build a great future.",
            "Discipline is the bridge between goals and success.",
            "Do something today that your future self will thank you for.",
            "You don't have to be perfect, just consistent.",
            "Make today count."
        ],
        excellent: [
            "Outstanding day! Keep this momentum going.",
            "You crushed it today. Proud of you!",
            "This is what discipline looks like."
        ],
        good: [
            "Good effort! A little more push tomorrow.",
            "Progress is progress. Keep building.",
            "You're on the right track."
        ],
        poor: [
            "Tomorrow is a fresh start. Try again!",
            "Every champion has bad days. Come back stronger.",
            "Don't quit. Start small and keep going."
        ]
    };
    const list = quotes[level] || quotes.general;
    const seed = parseInt(today.replace(/-/g, ""), 10);
    return list[seed % list.length];
}
/* Daily quote on the tasks page */
function showDailyQuote() {
    const el = document.getElementById("dailyQuote");
    if (el) {
        el.innerText = "💡 " + getQuote("general");
    }
}
showDailyQuote();
/* Progress bar on the tasks page */
function updateProgress() {
    const panel = document.getElementById("progressPanel");
    if (!panel) {
        return;
    }
    if (!data.tasks || data.tasks.length === 0) {
        panel.style.display = "none";
        return;
    }
    panel.style.display = "block";
    let marked = 0;
    let points = 0;
    data.tasks.forEach(function(task) {
        if (task.status !== null) {
            marked++;
        }
        points += task.points;
    });
    const total = data.tasks.length;
    const percent = Math.round((marked / total) * 100);
    document.getElementById("progressText").innerText =
        "Marked: " + marked + "/" + total;
    document.getElementById("progressPoints").innerText =
        "Points so far: " + points + "/" + (total * 2);
    document.getElementById("progressPercent").innerText = percent + "%";
    document.getElementById("progressFill").style.width = percent + "%";
}
/* Delete a single task */
function deleteTask(taskId) {
    data.tasks = data.tasks.filter(function(task) {
        return task.id !== taskId;
    });
    saveData();
    displayTasks();
}
/* ---------- History ---------- */
function loadHistory() {
    try {
        return JSON.parse(localStorage.getItem("makeYourselfGoodHistory")) || {};
    } catch (e) {
        return {};
    }
}
function saveHistoryToday(stats) {
    if (data.tasks.length === 0) {
        return;
    }
    const history = loadHistory();
    history[today] = stats;
    localStorage.setItem(
        "makeYourselfGoodHistory",
        JSON.stringify(history)
    );
}
function dateKeyBack(daysBack) {
    const d = new Date(today + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - daysBack);
    return d.toISOString().split("T")[0];
}
/* ---------- Performance graph ---------- */
function drawPerformanceGraph() {
    const box = document.getElementById("performanceGraph");
    if (!box) {
        return;
    }
    const n = data.tasks.length;
    if (n === 0) {
        box.innerHTML =
            '<div class="graph-empty">No tasks to show yet. Add tasks and submit to see your graph.</div>';
        return;
    }
    const W = Math.max(700, n * 70 + 120);
    const H = 320;
    const left = 80, right = 25, top = 25, bottom = 50;
    const plotW = W - left - right;
    const plotH = H - top - bottom;
    const slot = plotW / n;
    const barW = Math.min(46, slot * 0.55);
    function yFor(points) {
        return top + plotH - (points / 2) * plotH;
    }
    let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
    /* grid + y labels */
    const labels = [[0, "Poor (0)"], [1, "Good (1)"], [2, "Excellent (2)"]];
    labels.forEach(function(item) {
        const y = yFor(item[0]);
        svg += '<line x1="' + left + '" y1="' + y + '" x2="' + (W - right) +
               '" y2="' + y + '" stroke="#b8812b" stroke-opacity="0.35" stroke-dasharray="5 5"/>';
        svg += '<text x="' + (left - 8) + '" y="' + (y + 4) +
               '" text-anchor="end" font-size="11" fill="#e8b95a">' + item[1] + '</text>';
    });
    /* bars */
    const colors = { 2: "#7c3aed", 1: "#b8812b", 0: "#4a2a2a" };
    let running = 0;
    let linePoints = [];
    data.tasks.forEach(function(task, i) {
        const cx = left + slot * i + slot / 2;
        const y = yFor(task.points);
        const h = Math.max(top + plotH - y, 4);
        svg += '<rect x="' + (cx - barW / 2) + '" y="' + (top + plotH - h) +
               '" width="' + barW + '" height="' + h + '" rx="6" fill="' +
               colors[task.points] + '" stroke="#e8b95a" stroke-opacity="0.6"/>';
        svg += '<text x="' + cx + '" y="' + (H - 25) +
               '" text-anchor="middle" font-size="12" fill="#fff4dc">T' + (i + 1) + '</text>';
        running += task.points;
        linePoints.push([cx, yFor(running / (i + 1)), running / (i + 1)]);
    });
    /* running average line */
    const path = linePoints.map(function(p, i) {
        return (i === 0 ? "M" : "L") + p[0] + " " + p[1];
    }).join(" ");
    svg += '<path d="' + path + '" fill="none" stroke="#ffd27a" stroke-width="3"/>';
    linePoints.forEach(function(p) {
        svg += '<circle cx="' + p[0] + '" cy="' + p[1] +
               '" r="5" fill="#0a0010" stroke="#ffd27a" stroke-width="2"/>';
    });
    svg += '</svg>';
    box.innerHTML =
        '<div class="graph-scroll">' + svg + '</div>' +
        '<div class="graph-legend">' +
        '<span><i style="background:#7c3aed"></i>Excellent (Done)</span>' +
        '<span><i style="background:#b8812b"></i>Good (Half done)</span>' +
        '<span><i style="background:#4a2a2a"></i>Poor (Not done)</span>' +
        '<span><i style="background:#ffd27a"></i>Running average</span>' +
        '</div>';
}
/* ---------- Result page extras ---------- */
function renderResultExtras(totalPoints, maximumPoints, overall) {
    if (!document.getElementById("statDone")) {
        return;
    }
    let done = 0, half = 0, missed = 0;
    data.tasks.forEach(function(task) {
        if (task.status === "done") { done++; }
        else if (task.status === "half") { half++; }
        else { missed++; }
    });
    const percent = maximumPoints > 0
        ? Math.round((totalPoints / maximumPoints) * 100)
        : 0;
    document.getElementById("statDone").innerText = done;
    document.getElementById("statHalf").innerText = half;
    document.getElementById("statMissed").innerText = missed;
    document.getElementById("statPercent").innerText = percent + "%";
    document.getElementById("resultQuote").innerText =
        "💡 " + getQuote(overall.toLowerCase());
    drawPerformanceGraph();
    saveHistoryToday({
        points: totalPoints,
        max: maximumPoints,
        percent: percent,
        tasks: data.tasks.length,
        done: done,
        half: half,
        missed: missed
    });
    renderHistory();
}
function renderHistory() {
    const box = document.getElementById("historyBars");
    if (!box) {
        return;
    }
    const history = loadHistory();
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    let html = "";
    for (let i = 6; i >= 0; i--) {
        const key = dateKeyBack(i);
        const entry = history[key];
        const d = new Date(key + "T00:00:00Z");
        const name = dayNames[d.getUTCDay()];
        const pct = entry ? entry.percent : 0;
        html +=
            '<div class="history-col">' +
            '<span>' + (entry ? pct + "%" : "-") + '</span>' +
            '<div class="history-bar ' + (entry ? "" : "empty") +
            '" style="height:' + Math.max(pct, 2) + '%"></div>' +
            '<span>' + name + '</span>' +
            '</div>';
    }
    box.innerHTML = html;
    /* streak: consecutive "good" days (50%+), counting back from today */
    let streak = 0;
    let start = (history[today] && history[today].percent >= 50) ? 0 : 1;
    for (let i = start; i < 3650; i++) {
        const entry = history[dateKeyBack(i)];
        if (entry && entry.percent >= 50) {
            streak++;
        } else {
            break;
        }
    }
    let best = null;
    Object.keys(history).forEach(function(key) {
        if (!best || history[key].percent > history[best].percent) {
            best = key;
        }
    });
    document.getElementById("historyStreak").innerText =
        "🔥 Streak: " + streak + " day" + (streak === 1 ? "" : "s");
    document.getElementById("historyBest").innerText =
        best ? "🏆 Best day: " + best + " (" + history[best].percent + "%)" : "🏆 Best day: -";
}
function printReport() {
    window.print();
}
</script>
